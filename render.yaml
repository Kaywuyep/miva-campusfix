# Render "Blueprint": one web service that runs the API and serves the React build.
# Set MONGO_URI (MongoDB Atlas) in the Render dashboard — it is not stored here.
services:
  - type: web
    name: codespireFix
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: MONGO_URI
        sync: false
